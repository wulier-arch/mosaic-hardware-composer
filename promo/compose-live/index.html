<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MOSAIC · 实拍版合成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Instrument+Serif&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #06060a; }
  body { font-family: "Archivo", "Inter", -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
         color: #f2f1ee; -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1; }
  .mono { font-family: "Geist Mono", ui-monospace, Menlo, monospace; }
  .serif { font-family: "Instrument Serif", "Songti SC", Georgia, serif; font-weight: 400; }

  /* 舞台：实拍画面略微内缩并做透视，营造「屏幕在空间里」的观感 */
  #stage { position: absolute; inset: 0; perspective: 2200px; perspective-origin: 50% 50%; }
  #frame {
    position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    transform-style: preserve-3d; transform-origin: 50% 50%; overflow: hidden;
    background: #06060a; border-radius: 14px;
    box-shadow: 0 60px 160px rgba(0,0,0,.9), 0 0 0 1px rgba(167,139,250,.30), 0 0 120px rgba(167,139,250,.16);
  }
  #base { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }

  /* 后期叠加 */
  #fx { position: absolute; inset: 0; pointer-events: none; }
  #scrim { position: absolute; inset: 0; opacity: 0;
    background: linear-gradient(102deg, rgba(6,6,10,.90) 0%, rgba(6,6,10,.62) 17%, rgba(6,6,10,0) 40%),
                linear-gradient(0deg, rgba(6,6,10,.86) 0%, rgba(6,6,10,0) 24%),
                linear-gradient(270deg, rgba(6,6,10,.62) 0%, rgba(6,6,10,0) 12%); }
  #vignette { position: absolute; inset: 0;
    background: radial-gradient(ellipse 78% 74% at 50% 48%, transparent 44%, rgba(0,0,0,.52) 100%); }
  #grain { position: absolute; inset: 0; opacity: .05; mix-blend-mode: overlay;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.55) 0 1px, transparent 1px 3px); }
  #flash { position: absolute; inset: 0; opacity: 0; background: #fff; }

  /* 录制 HUD：四角刻度 + REC */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #hudframe { position: absolute; inset: 0; opacity: 0; }
  #hudframe i { position: absolute; width: 34px; height: 34px; border: 2px solid rgba(167,139,250,.85); }
  #hudframe i:nth-child(1) { left: 26px;  top: 26px;    border-right: 0; border-bottom: 0; }
  #hudframe i:nth-child(2) { right: 26px; top: 26px;    border-left: 0;  border-bottom: 0; }
  #hudframe i:nth-child(3) { left: 26px;  bottom: 26px; border-right: 0; border-top: 0; }
  #hudframe i:nth-child(4) { right: 26px; bottom: 26px; border-left: 0;  border-top: 0; }
  #rec { position: absolute; left: 50%; top: 34px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; opacity: 0;
    font-family: "Geist Mono", monospace; font-size: 14px; letter-spacing: .22em;
    color: rgba(242,241,238,.72); }
  #rec b { width: 11px; height: 11px; border-radius: 50%; background: #ff4d4d;
    box-shadow: 0 0 16px rgba(255,77,77,.9); }

  /* 标题 */
  #title { position: absolute; left: 104px; bottom: 112px; opacity: 0; }
  #title .num { font-family: "Geist Mono", monospace; font-size: 15px; letter-spacing: .3em; color: #a78bfa; }
  #title h1 { font-size: 56px; line-height: 1.08; letter-spacing: -.028em; margin-top: 12px; font-weight: 600; }
  #title .sub { font-size: 19px; color: rgba(242,241,238,.66); margin-top: 12px; max-width: 560px; line-height: 1.55; }
  #title .rule { width: 74px; height: 3px; background: #a78bfa; margin-top: 18px; border-radius: 2px;
    box-shadow: 0 0 20px rgba(167,139,250,.85); }

  /* 右上角指标 */
  #metrics { position: absolute; right: 104px; top: 96px; text-align: right; opacity: 0; }
  #metrics .m { margin-bottom: 16px; }
  #metrics .m .k { font-family: "Geist Mono", monospace; font-size: 11px; letter-spacing: .2em;
    color: rgba(242,241,238,.38); text-transform: uppercase; }
  #metrics .m .v { font-family: "Geist Mono", monospace; font-size: 38px; font-weight: 600;
    letter-spacing: -.03em; line-height: 1.14; }

  /* 模块浮标 */
  .tag { position: absolute; left: 0; top: 0; padding: 12px 17px; border-radius: 11px; opacity: 0;
    background: linear-gradient(140deg, rgba(62,48,96,.97), rgba(30,24,46,.97));
    border: 1px solid rgba(167,139,250,.72);
    box-shadow: 0 16px 40px rgba(0,0,0,.6), 0 0 30px rgba(167,139,250,.22); white-space: nowrap; }
  .tag .nm { font-size: 17px; font-weight: 600; }
  .tag .sb { font-family: "Geist Mono", monospace; font-size: 11.5px; color: rgba(242,241,238,.55); margin-top: 4px; }

  /* 角标 */
  .corner { position: absolute; font-family: "Geist Mono", monospace; font-size: 13px;
    letter-spacing: .22em; color: rgba(242,241,238,.30); text-transform: uppercase; }
  #c-tl { left: 104px; top: 52px; }
  #c-tr { right: 104px; top: 52px; }
  #c-bl { left: 104px; bottom: 48px; }

  /* 进度条 */
  #prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(242,241,238,.09); }
  #prog > i { display: block; height: 100%; background: linear-gradient(90deg, #6d4ee0, #a78bfa);
    box-shadow: 0 0 16px rgba(167,139,250,.85); }

  /* 开场 / 收尾 */
  #logo { position: absolute; left: 50%; top: 50%; text-align: center; opacity: 0; }
  #logo .mark { font-size: 92px; font-weight: 800; letter-spacing: -.045em; line-height: 1; }
  #logo .mark em { font-style: normal; color: #a78bfa; }
  #logo .cn { font-family: "Geist Mono", monospace; font-size: 21px; letter-spacing: .5em;
    color: rgba(242,241,238,.5); margin-top: 16px; }
  #logo .tag2 { font-size: 26px; color: rgba(242,241,238,.88); margin-top: 28px; }

  #outro { position: absolute; left: 50%; top: 47%; text-align: center; opacity: 0; }
  #outro .tag2 { font-size: 50px; letter-spacing: -.02em; line-height: 1.16; }
  #outro .chips { display: flex; gap: 12px; justify-content: center; margin-top: 38px; }
  #outro .chips span { font-family: "Geist Mono", monospace; font-size: 14px; letter-spacing: .1em;
    padding: 10px 20px; border-radius: 999px; border: 1px solid rgba(167,139,250,.42);
    background: rgba(167,139,250,.10); color: #d9cdfb; }
  #outro .credit { font-family: "Geist Mono", monospace; font-size: 12px; letter-spacing: .1em;
    color: rgba(242,241,238,.34); margin-top: 48px; }
</style>
</head>
<body>

<div id="stage">
  <div id="frame">
    <img id="base" alt="">
    <div id="fx">
      <div id="scrim"></div>
      <div id="vignette"></div>
      <div id="grain"></div>
      <div id="flash"></div>
    </div>
  </div>
</div>

<div id="hud">
  <div id="hudframe"><i></i><i></i><i></i><i></i></div>
  <div id="rec"><b></b>REC · 1920×1080 · 30FPS</div>

  <div class="corner" id="c-tl">MOSAIC / 拼造</div>
  <div class="corner" id="c-tr">HARDWARE COMPOSER</div>
  <div class="corner" id="c-bl">实拍录屏 · 未加速界面</div>

  <div id="metrics"></div>

  <div id="title">
    <div class="num" id="t-num"></div>
    <h1 id="t-h"></h1>
    <div class="sub" id="t-sub"></div>
    <div class="rule"></div>
  </div>

  <div id="logo">
    <div class="mark">MOS<em>A</em>IC</div>
    <div class="cn">拼 造</div>
    <div class="tag2 serif">真实操作，一镜到底。</div>
  </div>

  <div id="outro">
    <div class="tag2 serif">先验证可行性，<br>再决定要不要花钱。</div>
    <div class="chips">
      <span>GitHub Pages</span><span>Vercel</span><span>Cloudflare</span>
      <span>微信支付</span><span>支付宝</span>
    </div>
    <div class="credit">BGM: Kevin MacLeod — "Long Time Coming" (incompetech.com) · CC BY 4.0</div>
  </div>

  <div id="prog"><i></i></div>
</div>

<script>
/* =========================================================================
   MOSAIC 实拍版合成
   · 底图来自真实操作录屏（CDP screencast），已按 120BPM 拍网格剪辑
   · 全部叠加由单一 render(T) 驱动，逐帧确定性渲染
   ========================================================================= */
const FPS = 30, DUR = 30, NFRAMES = FPS * DUR, BEAT = 0.5, DROP = 12.0;
const ACCENT = '#a78bfa';

const c01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const seg = (t, a, b) => c01((t - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;
const eOut = x => 1 - Math.pow(1 - x, 3);
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -11 * x);
const eOutBack = x => 1 + 2.2 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const beatPulse = t => Math.pow(1 - ((t / BEAT) % 1 + 1) % 1, 7);
const beatIdx = t => Math.floor(t / BEAT);
const onBeat = (t, k) => seg(t, k * BEAT, k * BEAT + 0.11);

const $ = s => document.querySelector(s);
const base = $('#base'), frame = $('#frame'), flash = $('#flash');
const titleEl = $('#title'), logoEl = $('#logo'), outroEl = $('#outro');
const metricsEl = $('#metrics'), scrim = $('#scrim');

/* ---------- 底图：逐帧切换 ---------- */
let curSrc = '';
async function setBase(f) {
  const src = '../base/f' + String(f).padStart(4, '0') + '.jpg';
  if (curSrc === src) return;
  curSrc = src;
  await new Promise(r => { base.onload = r; base.onerror = r; base.src = src; });
}

/* ---------- 场景定义（与剪辑时间线一致） ---------- */
const SCENES = [
  { a: 0.00, b: 2.00, num: '', h: '', sub: '', zoom: [1.06, 1.15] },
  { a: 2.00, b: 6.00, num: '01 / MODULE LIBRARY', h: '86 个模块，8 大分类',
    sub: '开发板、传感器、电机、电源、通信、显示与结构件，全部带接口与供电标注。', zoom: [1.14, 1.0] },
  { a: 6.00, b: 9.50, num: '02 / FILTER', h: '按接口、电压、价格<br>收敛候选集',
    sub: '关键词、总线类型、供电电压、价格上限与库存状态可任意组合筛选。', zoom: [1.0, 1.06] },
  { a: 9.50, b: 12.00, num: '03 / COMPOSER', h: '先定主控',
    sub: '主控决定可用总线、逻辑电平、供电能力与算力档位，是全部校验的基准。', zoom: [1.06, 1.0] },
  { a: 12.00, b: 17.00, num: '04 / LIVE VALIDATION', h: '加购即校验<br>把买错成本降到零',
    sub: '每加一个模块，引脚占用、功耗预算、成本明细与冲突报告即时重算。', zoom: [1.0, 1.07] },
  { a: 17.00, b: 20.00, num: '05 / CONFLICT', h: '冲突当场发现<br>换主控即刻解决',
    sub: '摄像头需要进阶算力，5V 基础算力主控无法驱动 —— 换成 ESP32-S3 后冲突消除。', zoom: [1.06, 1.0] },
  { a: 20.00, b: 23.00, num: '06 / CHECKOUT', h: '收货、发票、运费<br>一次填完',
    sub: '手机号与地址格式校验、偏远地区运费判定、满 299 免运费、发票信息联动。', zoom: [1.0, 1.06] },
  { a: 23.00, b: 25.50, num: '07 / PAYMENT', h: '微信支付与支付宝<br>双通道扫码',
    sub: '服务端下单返回二维码，支付结果由异步通知验签后落库，前端只做轮询。', zoom: [1.06, 1.0] },
  { a: 25.50, b: 29.00, num: '08 / FULFILLMENT', h: '备货、发货、完成<br>状态实时同步',
    sub: '订单看板、快递单号录入、退款回滚库存、CSV 导出，全部在后台完成。', zoom: [1.0, 1.06] },
  { a: 29.00, b: 30.00, num: '', h: '', sub: '', zoom: [1.12, 1.16] },
];

const METRICS = [
  { a: 2.10, b: 5.95, items: [['在售模块', '86'], ['硬件分类', '8']] },
  { a: 6.10, b: 9.45, items: [['命中结果', '20'], ['筛选维度', '6']] },
  { a: 9.60, b: 11.95, items: [['方案', '空'], ['待选主控', '1']] },
  { a: 12.10, b: 16.95, items: [['已选模块', '8 类'], ['方案总价', '¥362']] },
  { a: 17.10, b: 19.95, items: [['冲突', '1 → 0'], ['算力档位', '基础 → 进阶']] },
  { a: 20.10, b: 22.95, items: [['运费', '免'], ['发票', '已开']] },
  { a: 23.10, b: 25.45, items: [['应付', '¥362'], ['状态', '支付成功']] },
  { a: 25.60, b: 28.95, items: [['状态', '已发货'], ['单号', 'SF9988…']] },
];

/* ---------- 模块浮标：在「工作台逐个装配」段落里逐个弹出 ---------- */
const TAGS = [
  { t: 12.35, x: 132, y: 300, nm: 'ESP32-S3-DevKitC-1', sb: '主控 · 3.3V · 45 GPIO' },
  { t: 13.35, x: 132, y: 402, nm: 'SHT31 高精度温湿度', sb: 'I2C 0x44 · ±0.3°C' },
  { t: 14.10, x: 132, y: 504, nm: 'SGP30 TVOC / eCO₂', sb: 'I2C 0x58 · 免预热' },
  { t: 14.85, x: 132, y: 606, nm: 'BH1750 光照传感器', sb: 'I2C 0x23 · 1–65535 lx' },
  { t: 15.60, x: 132, y: 708, nm: '0.96" OLED 显示屏', sb: 'I2C 0x3C · 128×64' },
  { t: 16.30, x: 132, y: 810, nm: 'LoRa SX1278 433MHz', sb: 'SPI · 视距 3–5 km' },
];
const tagEls = TAGS.map((d, i) => {
  const el = document.createElement('div');
  el.className = 'tag';
  el.innerHTML = `<div class="nm">${d.nm}</div><div class="sb">${d.sb}</div>`;
  $('#hud').appendChild(el);
  return { el, d, i };
});

/* ---------- 渲染 ---------- */
function renderBg(T) {
  const beat = beatPulse(T);
  const drop = seg(T, DROP, DROP + 0.22);
  // 实拍画面：轻微透视推近 + 呼吸；DROP 时向前砸一下
  const sc = SCENES.find(s => T >= s.a && T < s.b) || SCENES[SCENES.length - 1];
  const local = c01((T - sc.a) / (sc.b - sc.a));
  const zoom = sc.zoom ? lerp(sc.zoom[0], sc.zoom[1], eInOut(local)) : 1;
  const kick = 1 + 0.035 * (1 - seg(T, DROP, DROP + 0.5)) * Math.cos((T - DROP) * 20);
  const inset = lerp(1, 0.955, seg(T, 0.0, 0.6)) * (1 - seg(T, 29.4, 30.0) * 0.06);
  const s = zoom * kick * inset;
  const ry = Math.sin(T * 0.24) * 1.5 - drop * 1.2;
  const rx = Math.cos(T * 0.19) * 1.1;
  const ty = Math.sin(T * 0.17) * 5;
  frame.style.transform =
    `translate(-50%,-50%) translate3d(${Math.sin(T * 0.13) * 7}px, ${ty}px, 0)` +
    ` rotateY(${ry}deg) rotateX(${rx}deg) scale(${s})`;
  frame.style.borderRadius = Math.round(lerp(0, 14, seg(T, 0.0, 0.6))) + 'px';

  // 背景辉光（画面外的暗场）
  document.body.style.background =
    `radial-gradient(ellipse 62% 58% at 50% 46%, rgba(167,139,250,${0.10 + beat * 0.07 + drop * 0.12}), transparent 70%), #06060a`;
  flash.style.background = ACCENT;
  if (T > DROP && T < DROP + 0.14) flash.style.opacity = 0.26 * (1 - seg(T, DROP, DROP + 0.14));
  const flashAt = [17.0, 20.2, 23.0, 25.8];
  flashAt.forEach(t0 => { if (T > t0 && T < t0 + 0.12) flash.style.opacity = 0.14 * (1 - seg(T, t0, t0 + 0.12)); });

  // 录制 HUD 的四角刻度 + REC
  const hudOn = seg(T, 0.55, 1.1) * (1 - seg(T, 28.6, 29.2));
  $('#hudframe').style.opacity = hudOn * 0.9;
  const rec = $('#rec');
  rec.style.opacity = hudOn * 0.9;
  rec.querySelector('b').style.opacity = 0.35 + 0.65 * (beatIdx(T) % 2 === 0 ? 1 : 0.15);

  // 收尾压暗
  const outA = seg(T, 29.35, 30.0);
  $('#vignette').style.opacity = 1 + outA * 0.9;
}

function renderTitle(T) {
  const sc = SCENES.find(s => T >= s.a && T < s.b);
  if (!sc || !sc.num) { titleEl.style.opacity = 0; scrim.style.opacity = 0; return; }
  if (titleEl.dataset.k !== sc.num) {
    titleEl.dataset.k = sc.num;
    $('#t-num').textContent = sc.num;
    $('#t-h').innerHTML = sc.h;
    $('#t-sub').textContent = sc.sub;
  }
  const p = eOutExpo(seg(T, sc.a + 0.14, sc.a + 0.76));
  const o = 1 - seg(T, sc.b - 0.34, sc.b);
  titleEl.style.opacity = p * o;
  titleEl.style.transform = `translate3d(${lerp(-46, 0, p)}px,0,0)`;
  scrim.style.opacity = p * o * 0.95;
}

function renderMetrics(T) {
  const cur = METRICS.find(m => T >= m.a && T < m.b);
  if (!cur) { metricsEl.style.opacity = 0; metricsEl.dataset.k = ''; return; }
  const key = cur.a + '';
  if (metricsEl.dataset.k !== key) {
    metricsEl.dataset.k = key;
    metricsEl.innerHTML = cur.items.map(([k, v]) =>
      `<div class="m"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  }
  const p = eOutExpo(seg(T, cur.a + 0.12, cur.a + 0.72));
  metricsEl.style.opacity = p * (1 - seg(T, cur.b - 0.32, cur.b));
  metricsEl.style.transform = `translate3d(${lerp(36, 0, p)}px,0,0)`;
  metricsEl.querySelectorAll('.v').forEach((v, i) => {
    const lit = beatPulse(T - i * 0.25);
    v.style.color = `rgb(${Math.round(lerp(242, 167, lit * .8))},${Math.round(lerp(241, 139, lit * .8))},${Math.round(lerp(238, 250, lit * .8))})`;
    v.style.textShadow = lit > .3 ? `0 0 ${24 * lit}px rgba(167,139,250,${.8 * lit})` : 'none';
  });
}

function renderTags(T) {
  tagEls.forEach(({ el, d, i }) => {
    const p = eOutBack(seg(T, d.t, d.t + 0.42));
    const out = seg(T, 16.72, 17.06);
    el.style.opacity = c01(seg(T, d.t, d.t + 0.14)) * (1 - out);
    el.style.transform =
      `translate3d(${lerp(d.x - 90, d.x, p) + out * 120}px,${d.y}px,0)` +
      ` rotateY(${lerp(-34, 0, p)}deg) scale(${lerp(0.86, 1, p)})`;
    const lit = beatPulse(d.t);
    el.style.boxShadow = `0 16px 40px rgba(0,0,0,.6), 0 0 ${22 + 26 * lit}px rgba(167,139,250,${.22 + .4 * lit})`;
  });
}

function renderChrome(T) {
  $('#prog > i').style.width = (T / DUR * 100).toFixed(2) + '%';
  const out = seg(T, 29.2, 30.0);
  ['#c-tl', '#c-tr', '#c-bl'].forEach(s => { $(s).style.opacity = (1 - out) * 0.95; });
  $('#c-tl').style.color = `rgba(242,241,238,${0.24 + beatPulse(T) * 0.5})`;

  // 开场标志
  const lp = seg(T, 0.62, 1.24), lo = 1 - seg(T, 1.78, 2.00);
  logoEl.style.opacity = eOut(lp) * lo;
  logoEl.style.transform = `translate(-50%,-50%) scale(${lerp(0.92, 1, eOut(lp))}) translateY(${lerp(20, 0, eOut(lp))}px)`;

  // 收尾
  const op = eOutExpo(seg(T, 29.06, 29.62));
  outroEl.style.opacity = op * (1 - seg(T, 29.86, 30.0));
  outroEl.style.transform = `translate(-50%,-50%) scale(${lerp(1.06, 1, op)}) translateY(${lerp(22, 0, op)}px)`;
}

function render(T) {
  flash.style.opacity = 0;
  renderBg(T);
  renderTitle(T);
  renderMetrics(T);
  renderTags(T);
  renderChrome(T);
}

/* ---------- 对外接口：逐帧渲染（底图切换是异步的） ---------- */
window.seek = async function (frameNo) {
  const f = Math.max(0, Math.min(NFRAMES - 1, frameNo | 0));
  await setBase(f);
  render(f / FPS);
  return f / FPS;
};
window.VIDEO = { FPS, DUR, NFRAMES, BEAT, DROP };

/* ---------- 就绪门：预载前若干帧，避免首帧空白 ---------- */
